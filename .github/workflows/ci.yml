name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # SOLID スコアは絶対値(min-score)で門番せず、PR で base ブランチからの
  # 回帰(相対評価)だけを見る。スコアが下がった分は PR コメントで可視化する。
  solid:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SOLID score (PR diff)
        uses: harakeishi/go-solid-score@e56a9290595857b5a0f6aa39dfbf40aeb4aae5d1 # v0.3.0
        with:
          version: v0.3.0
          mode: diff
          # 一時的に緩和: まずは PR コメントでスコア差分を可視化したいので
          # しきい値を大きめにし、回帰で即 fail させない運用で様子を見る。
          max-drop: "20"
          fail-on-regression: "true"
          comment: "true"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...
